name: Deploy site

# The deploy itself, shared by staging and production so the two cannot drift.
# Callers supply which bucket and distribution to write to; everything else —
# the build, the upload order, the cache headers, the verification — is
# identical, which is the point. Staging is only useful as a rehearsal if it
# rehearses the real thing.
#
# Staging takes any branch on demand and holds whichever was deployed last, so
# the run summary records the branch as well as the commit.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy under
        required: true
        type: string
      bucket:
        description: S3 bucket to sync into
        required: true
        type: string
      distribution_id:
        description: CloudFront distribution to invalidate
        required: true
        type: string
      url:
        description: Public URL to verify once the deploy lands
        required: true
        type: string
    secrets:
      role_arn:
        required: true

permissions:
  id-token: write   # for AWS OIDC — no long-lived keys anywhere
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - name: Check the deploy target is configured
        run: |
          missing=""
          [ -n "${{ vars.AWS_REGION }}" ] || missing="$missing AWS_REGION(variable)"
          [ -n "${{ inputs.bucket }}" ] || missing="$missing bucket(input)"
          [ -n "${{ inputs.distribution_id }}" ] || missing="$missing distribution_id(input)"
          [ -n "${{ secrets.role_arn }}" ] || missing="$missing AWS_DEPLOY_ROLE_ARN(secret)"
          if [ -n "$missing" ]; then
            echo "Deploy is not configured yet. Missing:$missing"
            echo "See docs/DEPLOYMENT.md for the one-time AWS setup."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test:ci
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      # Every figure page offers its own chart as the picture a shared link
      # previews with, so those pictures have to exist before the HTML that
      # points at them goes up. This is not part of `npm run build`: it needs a
      # browser, and putting a chromium download in front of every local build
      # would be a poor trade for something only the deploy needs.
      #
      # `--with-deps` is deliberately absent. It runs `apt-get update`, and the
      # runner image has Google's Chrome repository configured, so a bad index
      # on dl.google.com fails the step — which it did, repeatedly, on 9
      # September 2026. The ubuntu runner already carries every library
      # Chromium needs, and Playwright downloads the browser itself from its
      # own CDN, so nothing here needs apt at all. Least of all the deploy:
      # publishing the site should not depend on Google's package index.
      - run: npx playwright install chromium

      - name: Render the social cards
        run: npm run render:og

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets first, with a long cache. Doing these before index.html
      # means a visitor never gets a new index.html that points at assets the
      # CDN has not seen yet.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync build/ "s3://${{ inputs.bucket }}/" \
            --exclude "*" \
            --include "static/*" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # Everything else: the entry point and files referenced by a stable name.
      # These must never be cached at the edge for long, or a deploy takes hours
      # to become visible.
      - name: Upload entry point and unhashed files
        run: |
          aws s3 sync build/ "s3://${{ inputs.bucket }}/" \
            --exclude "static/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete \
            --no-progress

      # Prerendered route files carry no extension, because the URLs do not.
      # `aws s3 sync` types an extensionless object as binary/octet-stream,
      # which a browser downloads rather than renders, so each one is re-put
      # with an explicit content type. The list comes from the catalogue, so a
      # new figure needs no change here.
      - name: Set the content type on prerendered routes
        run: |
          node scripts/list-routes.mjs | while read -r route; do
            [ "$route" = "/" ] && continue
            key="${route#/}"
            aws s3 cp "build/$key" "s3://${{ inputs.bucket }}/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate" \
              --no-progress
          done

      - name: Invalidate CloudFront
        run: |
          # Every route is its own object now, so every route needs
          # invalidating. Still never /*: fingerprinted assets are a new URL
          # when they change and never need it.
          ROUTES=$(node scripts/list-routes.mjs | tr '\n' ' ')
          INVALIDATION=$(aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.distribution_id }}" \
            --paths "/index.html" "/manifest.json" "/robots.txt" "/sitemap.xml" "/og/*" $ROUTES \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INVALIDATION created; waiting for it to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ inputs.distribution_id }}" \
            --id "$INVALIDATION"

      - name: Verify the deployed site responds
        run: |
          for attempt in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.url }}/")
            if [ "$STATUS" = "200" ]; then
              echo "${{ inputs.url }} responded 200."
              exit 0
            fi
            echo "Attempt $attempt: got HTTP $STATUS, retrying in 10s."
            sleep 10
          done
          echo "Site did not return 200 after deploy."
          exit 1

      # A figure permalink has to serve its own title before any JavaScript
      # runs, because a social scraper never runs any. This is the check that
      # would have caught every route serving identical HTML.
      - name: Verify a permalink serves its own title
        run: |
          ROUTE=$(node scripts/list-routes.mjs | grep "^/f/" | head -1)
          TITLE=$(curl -s "${{ inputs.url }}$ROUTE" | grep -o "<title>[^<]*</title>")
          echo "$ROUTE -> $TITLE"
          if echo "$TITLE" | grep -q "Data that matters most to Albertans"; then
            echo "That is the site default. Routes are serving identical HTML again."
            exit 1
          fi

      # The image a shared link previews with lives at a URL the HTML asserts
      # exists. If the render step were ever skipped, or the upload missed the
      # directory, the preview would be broken and the only place it would show
      # is somebody else's timeline. Checked live rather than trusted from the
      # build, because this is the layer the build-time check cannot see: the
      # upload and the CDN in front of it.
      #
      # Both kinds of card, not just a figure's: default.png answers for every
      # route that is not a figure — the home page among them — so it is the
      # single most-seen preview on the whole site.
      - name: Verify the social cards serve
        run: |
          check() {
            read -r STATUS TYPE <<< "$(curl -s -o /dev/null             -w '%{http_code} %{content_type}' "${{ inputs.url }}$1")"
            echo "$1 -> HTTP $STATUS, $TYPE"
            if [ "$STATUS" != "200" ] || [ "${TYPE%%;*}" != "image/png" ]; then
              echo "That social card is not being served as a PNG."
              exit 1
            fi
          }
          ROUTE=$(node scripts/list-routes.mjs | grep "^/f/" | head -1)
          check "/og/${ROUTE#/f/}.png"
          check "/og/default.png"

      - name: Summarise
        if: success()
        run: |
          {
            echo "### Deployed to ${{ inputs.environment }}"
            echo ""
            echo "- **URL:** ${{ inputs.url }}"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Bucket:** \`${{ inputs.bucket }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
