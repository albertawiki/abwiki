name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time, and never cancel one part-way through an S3 sync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alberta.wiki
    steps:
      # Fail with something actionable rather than an opaque AWS error the
      # first time this runs on a repo that has not been wired up yet.
      - name: Check the deploy target is configured
        run: |
          missing=""
          [ -n "${{ vars.AWS_REGION }}" ] || missing="$missing AWS_REGION(variable)"
          [ -n "${{ vars.AWS_S3_BUCKET }}" ] || missing="$missing AWS_S3_BUCKET(variable)"
          [ -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ] || missing="$missing CLOUDFRONT_DISTRIBUTION_ID(variable)"
          [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] || missing="$missing AWS_DEPLOY_ROLE_ARN(secret)"
          if [ -n "$missing" ]; then
            echo "Deploy is not configured yet. Missing:$missing"
            echo "See docs/DEPLOYMENT.md for the one-time AWS setup."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm run test:ci
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets first, with a long cache. Doing these before index.html
      # means a visitor never gets a new index.html that points at assets the
      # CDN has not seen yet.
      - name: Upload fingerprinted assets
        run: |
          aws s3 sync build/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --exclude "*" \
            --include "static/*" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress

      # Everything else: the entry point and files referenced by a stable name.
      # These must never be cached at the edge for long, or a deploy takes hours
      # to become visible.
      - name: Upload entry point and unhashed files
        run: |
          aws s3 sync build/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --exclude "static/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --delete \
            --no-progress

      - name: Invalidate CloudFront
        run: |
          INVALIDATION=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html" "/manifest.json" "/robots.txt" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $INVALIDATION created; waiting for it to complete."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$INVALIDATION"

      - name: Verify the deployed site responds
        run: |
          for attempt in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://alberta.wiki/)
            if [ "$STATUS" = "200" ]; then
              echo "alberta.wiki responded 200."
              exit 0
            fi
            echo "Attempt $attempt: got HTTP $STATUS, retrying in 10s."
            sleep 10
          done
          echo "Site did not return 200 after deploy."
          exit 1
