name: Deploy to staging

# Run this from the Actions tab against any branch to put it on the staging
# site. There is one staging bucket, so the last run wins: whatever you
# deployed most recently is what is there.
#
# Preview a branch here before merging it. Merging to main publishes to
# alberta.wiki, so the look at staging is the review.

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  staging:
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: staging
      bucket: ${{ vars.AWS_S3_BUCKET_STAGING }}
      distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID_STAGING }}
      url: ${{ vars.STAGING_URL }}
    secrets:
      role_arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
