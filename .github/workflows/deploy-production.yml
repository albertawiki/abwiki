name: Deploy to production

# Merging to main publishes alberta.wiki. Preview the branch on staging first
# and merge when it looks right; the merge is the decision to publish.
#
# The dispatch trigger is for re-running a deploy of main without a new commit,
# after a failed run or a CloudFront change. It only runs on main: both the
# guard below and the production environment's branch policy enforce that, and
# the deploy role's trust policy is scoped to the production environment.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Confirm this is a deploy of main
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "Production deploys only from main; this ran on '${{ github.ref_name }}'."
          echo "To preview this branch, run 'Deploy to staging' against it instead."
          exit 1

  production:
    needs: guard
    uses: ./.github/workflows/deploy-site.yml
    with:
      environment: production
      bucket: ${{ vars.AWS_S3_BUCKET }}
      distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      url: https://alberta.wiki
    secrets:
      role_arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
