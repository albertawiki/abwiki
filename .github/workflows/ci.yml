name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before the tests, because a leaked credential is worth knowing about
      # in ten seconds rather than after a five-minute suite. The pre-commit
      # hook runs the same script, but `--no-verify` skips a hook and nothing
      # skips this.
      - name: Check nothing secret is committed
        run: npm run check:secrets

      - name: Test
        run: npm run test:ci
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true   # treat warnings as errors

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ github.sha }}
          path: build/
          retention-days: 7

  verify-sources:
    # Checks published figures against Statistics Canada. Advisory on pull
    # requests: a source revision is a correction to schedule, not a reason to
    # block an unrelated change. The scheduled run in data-freshness.yml is
    # what actually raises it.
    name: Verify against sources
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare published figures with Statistics Canada
        run: node scripts/check-sources.mjs
